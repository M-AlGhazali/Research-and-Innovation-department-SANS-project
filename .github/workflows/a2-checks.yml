name: A2 reference and synthetic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: node tests/test-observed-model.mjs
      - run: node map-2/test-flight-model.mjs
      - run: git diff --exit-code -- map-2/data.json map-2/reference
