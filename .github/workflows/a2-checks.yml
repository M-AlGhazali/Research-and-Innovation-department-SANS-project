name: Masar tests (A2, fuel, scenarios, noise-population, Map 2)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      # One command runs every test: tests/ (A2, fuel, scenarios, both Node suites) and noise-population/tests
      - run: python -m pytest -q
      - run: git diff --exit-code -- map-2/data.json map-2/reference
