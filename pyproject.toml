[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sans-a2"
version = "0.1.0"
description = "Local, auditable OEJN observed-departure research pipeline"
requires-python = ">=3.12"
# Pins match the root requirements.txt (the one file for the whole repo).
dependencies = ["duckdb==2.0.0", "pytz==2026.5", "pyproj==3.8.0", "psutil==7.2.1", "numpy==2.5.3", "pandas==3.0.6", "jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
fuel = ["openap==2.6.2", "xarray==2026.9.0", "netCDF4==1.7.5.1", "scipy==1.18.1"]

[project.scripts]
sans-a2 = "sans_a2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# One command from the repo root runs every part: A2 + fuel + scenarios (tests/), the Node suites
# (tests/test_node_suites.py) and noise-population (A5, A6, Doc 29).
pythonpath = ["src", "noise-population/src"]
testpaths = ["tests", "noise-population/tests"]
