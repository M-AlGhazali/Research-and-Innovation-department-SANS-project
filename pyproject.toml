[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sans-a2"
version = "0.1.0"
description = "Local, auditable OEJN observed-departure research pipeline"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.6", "pytz==2026.5", "pyproj==3.7.2", "psutil==7.2.1", "numpy==2.5.2", "pandas==3.0.6", "jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
sans-a2 = "sans_a2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
